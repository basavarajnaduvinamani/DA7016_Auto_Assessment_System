# Render Blueprint: the Second Read teacher app with the Gradio lab at /lab.
# Render dashboard > New > Blueprint > pick this repo. Then fill in the keys
# marked sync: false under the service's Environment tab. See docs/deploy.md.
services:
  - type: web
    # The service name sets the onrender.com address: https://second-read.onrender.com
    name: second-read
    runtime: python
    plan: free
    buildCommand: pip install ".[web,ingest,annotate]"
    startCommand: autoassess serve --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: AUTOASSESS_DATA_DIR
        value: /tmp/redink
      - key: AUTOASSESS_SECRET_KEY
        generateValue: true
      - key: AUTOASSESS_LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_MODEL
        value: google/gemini-2.5-flash
      - key: OPENROUTER_API_KEY
        sync: false
      - key: BODHAN_OCR_API_KEY
        sync: false
      - key: BODHAN_TRANSLATE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Spend guards: the demo stops paid grading at these limits.
      - key: OPENROUTER_BUDGET_USD
        value: "18"
      - key: BODHAN_BUDGET_INR
        value: "100"
      - key: AUTOASSESS_DEMO_DRY_RUN
        value: "0"
      - key: AUTOASSESS_MAX_UPLOAD_MB
        value: "10"
      - key: AUTOASSESS_MAX_PAGES
        value: "8"
      - key: AUTOASSESS_DEMO_DAILY_SHEETS
        value: "40"
      - key: AUTOASSESS_CACHE_DIR
        value: /tmp/autoassess-cache
