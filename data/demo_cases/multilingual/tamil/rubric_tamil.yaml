  model_answer: கவனமானது ஒவ்வொரு டோக்கனுக்கும் மதிப்பு வெக்டர்களின் எடையிடப்பட்ட கூட்டுத்தொகையை கணக்கிடுகிறது. வினவல்கள், விசைகள் மற்றும் மதிப்புகள் உள்ளீட்டின் நேரியல் வீழல்கள் ஆகும். விசையின் பரிமாணத்தின் வர்க்க மூலத்தால் வகுக்கப்பட்ட ஒவ்வொரு விசையுடனும் வினவலின் அளவிடப்பட்ட புள்ளிப் பெருக்கத்திலிருந்து எடைகள் வருகின்றன, மேலும் ஒரு சாஃப்ட்மேக்ஸ் மூலம் அனுப்பப்படுகின்றன. மல்டி-ஹெட் அட்டென்ஷன் இவற்றில் பலவற்றை வெவ்வேறு வீழல்களில் இணையாக இயக்குகிறது மற்றும் அவற்றை இணைக்கிறது.
  text: ஒரு டிரான்ஸ்ஃபார்மரில் உள்ள அட்டென்ஷன் மெக்கானிசம் என்ன கணக்கிடுகிறது என்பதை விளக்கவும். (5 மதிப்பெண்கள்)
