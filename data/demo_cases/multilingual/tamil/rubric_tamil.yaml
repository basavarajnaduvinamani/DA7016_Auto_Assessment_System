  - description: செயல் தரவைப் பயன்படுத்தி மாதிரி எடைகளை ஃபைன்-டியூனிங் புதுப்பிக்கிறது என்று கூறுகிறது.
    id: Q3.c1
    marks: 1
  - description: இன்-கான்டெக்ஸ்ட் கற்றல் எடைகளை மாற்றாமல் விட்டுவிடுவதாகவும், ப்ராம்ப்ட்டில் உள்ள அறிவுறுத்தல்கள் அல்லது எடுத்துக்காட்டுகளைப் பயன்படுத்துவதாகவும் கூறுகிறது.
