  id: Q2
  max_marks: 4
  model_answer: மாயத்தோற்றம் என்பது ஒரு மாதிரி அதன் உள்ளீடு அல்லது ஆதாரங்களால் ஆதரிக்கப்படாத தவறான உரையை உருவாக்கும்போது ஏற்படுகிறது. அடுத்த டோக்கன் பயிற்சி நம்பத்தகுந்த உரைக்கு வெகுமதி அளிக்கிறது, சரிபார்க்கப்பட்ட உண்மைகளுக்கு அல்ல என்பதே இதற்குக் காரணம். மீட்டெடுப்பு மேம்படுத்தப்பட்ட தலைமுறை என்பது ஒரு தீர்வு ஆகும், இது பதில்களை மீட்டெடுக்கப்பட்ட ஆவணங்களில் அடிப்படையாகக் கொண்டு மாதிரியை மேற்கோள் காட்ட அனுமதிக்கிறது.
  text: பெரிய மொழி மாதிரிகளில் மாயத்தோற்றம் என்றால் என்ன? ஒரு காரணம் மற்றும் ஒரு தணிப்பு கொடுங்கள். (4 மதிப்பெண்கள்)
