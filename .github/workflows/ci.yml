name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[ingest,api,annotate,web,dev]"
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build teacher app image (no push)
        run: docker build --tag redink:ci .
      - name: Check offline container startup
        run: |
          docker run -d --network none --name redink-smoke -e AUTOASSESS_DEMO_DRY_RUN=1 redink:ci
          python - <<'PY'
          import subprocess
          import time
          for attempt in range(45):
              check = subprocess.run(['docker', 'exec', 'redink-smoke', 'python', '-c',
                  "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8000/healthz').status == 200"],
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              if check.returncode == 0:
                  break
              time.sleep(1)
          else:
              subprocess.run(['docker', 'logs', 'redink-smoke'])
              raise SystemExit('Container health check failed')
          PY
      - name: Stop smoke container
        if: always()
        run: docker rm -f redink-smoke || true
