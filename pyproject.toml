[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoassess"
version = "0.1.0"
description = "Grade full answer sheets against a rubric with marks per question and rubric-defensible feedback."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
ingest = ["pymupdf>=1.24", "opencv-python-headless>=4.9", "numpy>=1.26", "pillow>=10"]
api = ["fastapi>=0.110", "python-multipart>=0.0.9", "uvicorn>=0.29"]
annotate = ["pillow>=10.1"]
demo = ["gradio>=6.30,<6.31", "pillow>=10.1"]
dev = ["pytest>=8", "httpx>=0.27"]
report = ["matplotlib>=3.8"]
web = ["fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1", "python-multipart>=0.0.9", "itsdangerous>=2.2", "autoassess[demo]"]

[project.scripts]
autoassess = "autoassess.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autoassess = ["fonts/*.ttf", "fonts/*.txt", "sample_exam/*.yaml", "sample_exam/*.csv", "sample_exam/answer_sheets/*.txt", "sample_exam/answer_sheets/*.pdf", "web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
