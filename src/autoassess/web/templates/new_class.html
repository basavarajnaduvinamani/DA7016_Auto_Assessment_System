{% extends 'base.html' %}
{% block breadcrumb %}<span>/</span><span>New class</span>{% endblock %}
{% block content %}<div class="page-heading"><div><p class="eyebrow">MAKE ROOM FOR LEARNING</p><h1>New class</h1><p class="muted">A home for your roster and assignments.</p></div></div><section class="panel form-panel"><form action="/classes" method="post" class="stack">{% set values = values|default({}) %}<label>Class name<input name="name" value="{{ values.get('name', '') }}" maxlength="120" required placeholder="e.g. Introduction to Machine Learning"></label><div class="form-row"><label>Subject<input name="subject" value="{{ values.get('subject', '') }}" maxlength="120" required placeholder="Computer Science"></label><label>Section <span class="muted">(optional)</span><input name="section" value="{{ values.get('section', '') }}" maxlength="60" placeholder="A"></label></div><div class="actions"><button class="button">Create class</button><a href="/">Cancel</a></div></form></section>{% endblock %}
