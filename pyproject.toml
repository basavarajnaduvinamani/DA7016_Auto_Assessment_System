[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoassess"
version = "0.1.0"
description = "Grade full answer sheets against a rubric with marks per question and rubric-defensible feedback."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
ingest = ["pymupdf>=1.24", "opencv-python-headless>=4.9", "numpy>=1.26", "pillow>=10"]
api = ["fastapi>=0.110", "python-multipart>=0.0.9", "uvicorn>=0.29"]
annotate = ["pillow>=10.1"]
demo = ["gradio>=4.40", "pillow>=10.1"]
dev = ["pytest>=8", "httpx>=0.27"]
report = ["matplotlib>=3.8"]

[project.scripts]
autoassess = "autoassess.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autoassess = ["fonts/*.ttf", "fonts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
