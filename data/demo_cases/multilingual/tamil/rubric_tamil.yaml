  id: Q3
  max_marks: 6
  model_answer: சரியான முறையில் சரிசெய்வது (Fine-tuning) மாதிரி தரவுகளில் மாதிரியின் எடைகளை புதுப்பிக்கிறது, எனவே இதற்கு லேபிளிடப்பட்ட எடுத்துக்காட்டுகள், கணக்கீடு மற்றும் பயிற்சி ஓட்டம் தேவைப்படுகிறது, ஆனால் பின்னர் அனுமானத்தில் எந்த எடுத்துக்காட்டுகளும் தேவையில்லை மற்றும் புதிய வடிவங்களை நன்றாகக் கற்றுக்கொள்ள முடியும். சூழல் கற்றல் (In-context learning) எடைகளை மாற்றாமல் விட்டுவிடுகிறது மற்றும் அறிவுறுத்தல்கள் மற்றும் சில எடுத்துக்காட்டுகளை தூண்டுதலில் வைக்கிறது; இது முயற்சி செய்ய விரைவானது மற்றும் மலிவானது, ஆனால் சூழல் சாளரத்தால் கட்டுப்படுத்தப்படுகிறது மற்றும் ஒவ்வொரு அழைப்பிற்கும் டோக்கன்களைச் சேர்க்கிறது. போதுமான தரவு இருக்கும்போது முன்மாதிரியை உருவாக்கவும், பணி நிலையானதாகவும் அதிக அளவாகவும் இருக்கும்போது சரியான முறையில் சரிசெய்யவும் சூழல் கற்றலைப் பயன்படுத்தவும்.
  text: ஒரு புதிய பணிக்கு ஒரு LLM ஐ மாற்றியமைக்க, ஃபைன்-டியூனிங் மற்றும் இன்-கான்டெக்ஸ்ட் கற்றல் ஆகியவற்றை ஒப்பிடுக. (6 மதிப்பெண்கள்)
