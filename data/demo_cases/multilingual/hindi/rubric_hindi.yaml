  criteria:
  - description: यह बताता है कि क्वेरी, की और वैल्यू इनपुट टोकन के रैखिक प्रक्षेपण हैं।
    id: Q1.c1
    marks: 1
  - description: कहता है कि भार कुंजियों के साथ एक क्वेरी के डॉट प्रोडक्ट से आते हैं, जो कुंजी आयाम के वर्गमूल द्वारा स्केल किए जाते हैं।
    id: Q1.c2
    marks: 1.5
  - allow_partial: false
    description: यह सॉफ्टमैक्स का उल्लेख करता है जो स्कोर को भार में बदल देता है जिनका योग एक होता है।
    id: Q1.c3
    marks: 1
  - allow_partial: false
    description: कहता है कि आउटपुट वैल्यू वेक्टर्स का भारित योग है।
    id: Q1.c4
    marks: 1
  - allow_partial: false
    description: मल्टी-हेड अटेंशन को कई अटेंशन ऑपरेशनों के रूप में समझाता है जो समानांतर हैं जिनके आउटपुट को जोड़ दिया जाता है।
    id: Q1.c5
    marks: 0.5
  id: Q1
  max_marks: 5
  model_answer: ध्यान प्रत्येक टोकन के लिए, मान सदिशों का भारित योग की गणना करता है। क्वेरी, कुंजियाँ और मान इनपुट के रैखिक प्रक्षेपण हैं। वेट्स हर कुंजी के साथ क्वेरी के स्केल डॉट प्रोडक्ट से आते हैं, जिसे कुंजी आयाम के वर्गमूल से विभाजित किया जाता है और एक सॉफ्टमैक्स के माध्यम से पारित किया जाता है। मल्टी-हेड अटेंशन इनमें से कई को विभिन्न अनुमानों पर समानांतर में चलाता है और उन्हें जोड़ता है।
  text: बताइए कि ट्रांसफॉर्मर में अटेंशन मैकेनिज्म क्या कंप्यूट करता है। (5 अंक)
- aliases:
  - '2'
  - Ans 2
  - '2.'
  criteria:
  - description: मतिभ्रम को एक धाराप्रवाह आउटपुट के रूप में परिभाषित करता है जो इनपुट या स्रोतों द्वारा गलत या असमर्थित होता है।
    id: Q2.c1
    marks: 1.5
  - description: एक वैध कारण देता है, जैसे कि अगले टोकन प्रशिक्षण जो सत्य पर संभाव्यता को पुरस्कृत करता है, या प्रशिक्षण डेटा में अंतराल।
    id: Q2.c2
    marks: 1.25
  - description: एक वैध शमन देता है, जैसे कि पुनर्प्राप्ति संवर्धित पीढ़ी, स्रोतों का हवाला देना या अनिश्चित होने पर परहेज करना और बताता है कि यह कैसे मदद करता है।
    id: Q2.c3
    marks: 1.25
  id: Q2
  max_marks: 4
  model_answer: मतिभ्रम तब होता है जब एक मॉडल धाराप्रवाह पाठ उत्पन्न करता है जो गलत है या उसके इनपुट या स्रोतों द्वारा समर्थित नहीं है। इसका एक कारण यह है कि अगले टोकन प्रशिक्षण प्रशंसनीय पाठ को पुरस्कृत करता है, न कि सत्यापित तथ्यों को। एक शमन पुनर्प्राप्ति संवर्धित पीढ़ी है, जो उत्तरों को प्राप्त दस्तावेजों में आधार प्रदान करती है और मॉडल को उन्हें उद्धृत करने देती है।
  text: बड़े भाषा मॉडल में मतिभ्रम क्या है? एक कारण और एक निवारण दें। (4 अंक)
- aliases:
  - '3'
  - Ans 3
  - '3.'
  criteria:
  - description: स्टेट्स कहते हैं कि फाइन-ट्यूनिंग टास्क डेटा का उपयोग करके मॉडल वेट को अपडेट करता है।
    id: Q3.c1
    marks: 1
  - description: यह बताता है कि इन-कॉन्टेक्स्ट लर्निंग वेट को अपरिवर्तित छोड़ देती है और प्रॉम्प्ट में निर्देशों या उदाहरणों का उपयोग करती है।
    id: Q3.c2
    marks: 1
  - description: कम से कम एक फाइन-ट्यूनिंग की लागत देता है, जैसे कि लेबल किए गए डेटा, कंप्यूट या प्रशिक्षण रन की आवश्यकता।
    id: Q3.c3
    marks: 1
  - description: इन-कॉन्टेक्स्ट लर्निंग की कम से कम एक सीमा देता है, जैसे कि कॉन्टेक्स्ट विंडो का आकार या हर कॉल पर अतिरिक्त टोकन।
    id: Q3.c4
    marks: 1
  - description: यह बताता है कि प्रत्येक दृष्टिकोण को कब प्राथमिकता देनी चाहिए, उदाहरण के लिए पर्याप्त डेटा के साथ एक स्थिर उच्च मात्रा वाले कार्य के मुकाबले प्रोटोटाइप।
    id: Q3.c5
    marks: 2
  id: Q3
  max_marks: 6
  model_answer: फाइन-ट्यूनिंग कार्य डेटा पर मॉडल के वेट्स को अपडेट करता है, इसलिए इसे लेबल किए गए उदाहरणों, गणना और एक प्रशिक्षण रन की आवश्यकता होती है, लेकिन फिर अनुमान में किसी उदाहरण की आवश्यकता नहीं होती है और यह नए प्रारूपों को अच्छी तरह से सीख सकता है। इन-कॉन्टेक्स्ट लर्निंग वेट्स को अपरिवर्तित छोड़ देता है और प्रॉम्प्ट में निर्देश और कुछ उदाहरण डालता है; यह आज़माने में त्वरित और सस्ता है लेकिन संदर्भ विंडो द्वारा सीमित है और हर कॉल में टोकन जोड़ता है। प्रोटोटाइप करने के लिए इन-कॉन्टेक्स्ट लर्निंग का उपयोग करें और फाइन-ट्यूनिंग तब करें जब पर्याप्त डेटा हो और कार्य स्थिर और उच्च मात्रा वाला हो।
  text: एक नए कार्य के लिए एक एलएलएम को अनुकूलित करने के लिए फाइन-ट्यूनिंग और इन-कॉन्टेक्स्ट लर्निंग की तुलना करें। (6 अंक)
title: जनरेटिव एआई बेसिक्स क्विज़ (Hindi)
