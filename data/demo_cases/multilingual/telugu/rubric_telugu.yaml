exam_id: da7016-sample-te
language: te
questions:
- aliases:
  - '1'
  - Ans 1
  - '1.'
  criteria:
  - description: క్వెరీలు, కీలు మరియు విలువలు ఇన్‌పుట్ టోకెన్ల యొక్క లీనియర్ ప్రొజెక్షన్స్ అని పేర్కొంది.
    id: Q1.c1
    marks: 1
  - description: కీల కొలత యొక్క వర్గమూలం ద్వారా స్కేల్ చేయబడిన కీలతో ఒక ప్రశ్న యొక్క డాట్ ప్రొడక్ట్ నుండి బరువులు వస్తాయని చెబుతుంది.
    id: Q1.c2
    marks: 1.5
  - allow_partial: false
    description: స్కోర్‌లను ఒకటిగా కూడే వెయిట్‌లుగా మార్చే సాఫ్ట్‌మాక్స్ గురించి ప్రస్తావించారు.
    id: Q1.c3
    marks: 1
  - allow_partial: false
    description: అవుట్‌పుట్ అనేది విలువ వెక్టార్‌ల యొక్క వెయిటెడ్ సమ్ అని చెబుతుంది.
    id: Q1.c4
    marks: 1
  - allow_partial: false
    description: మల్టీ-హెడ్ అటెన్షన్‌ను సమాంతరంగా జరిగే అనేక అటెన్షన్ ఆపరేషన్లుగా వివరిస్తుంది, వీటి అవుట్‌పుట్‌లు కంకాటినేట్ చేయబడతాయి.
    id: Q1.c5
    marks: 0.5
  id: Q1
  max_marks: 5
  model_answer: ప్రతి టోకెన్ కోసం అటెన్షన్ విలువ వెక్టర్ల యొక్క వెయిటెడ్ మొత్తాన్ని లెక్కిస్తుంది. క్వెరీలు, కీలు మరియు విలువలు ఇన్‌పుట్ యొక్క లీనియర్ ప్రొజెక్షన్లు. ప్రతి కీతో క్వెరీ యొక్క స్కేల్డ్ డాట్ ప్రోడక్ట్ నుండి బరువులు వస్తాయి, కీ డైమెన్షన్ యొక్క స్క్వేర్ రూట్ ద్వారా విభజించబడతాయి మరియు సాఫ్ట్‌మాక్స్ ద్వారా పంపబడతాయి. మల్టీ-హెడ్ అటెన్షన్ వీటిలో చాలా వాటిని వేర్వేరు ప్రొజెక్షన్లపై సమాంతరంగా అమలు చేస్తుంది మరియు వాటిని కంకాటినేట్ చేస్తుంది.
  text: ట్రాన్స్‌ఫార్మర్‌లోని అటెన్షన్ మెకానిజం ఏమి లెక్కిస్తుందో వివరించండి. (5 మార్కులు)
- aliases:
  - '2'
  - Ans 2
  - '2.'
  criteria:
  - description: హెల్యుసినేషన్ అనేది ఇన్పుట్ లేదా మూలాల ద్వారా అవాస్తవమైన లేదా మద్దతు లేని ప్రవాహపూర్వక అవుట్‌పుట్‌గా నిర్వచిస్తుంది.
    id: Q2.c1
    marks: 1.5
  - description: సత్యం కంటే సంభావ్యతకు ప్రతిఫలం ఇచ్చే నెక్స్ట్-టోకెన్ శిక్షణ లేదా శిక్షణా డేటాలో ఖాళీలు వంటి ఒక చెల్లుబాటు అయ్యే కారణాన్ని ఇస్తుంది.
    id: Q2.c2
    marks: 1.25
  - description: రిట్రీవల్ ఆగ్మెంటెడ్ జనరేషన్, మూలాలను ఉదహరించడం లేదా ఖచ్చితంగా తెలియకపోయినప్పుడు విరమించుకోవడం వంటి ఒక చెల్లుబాటు అయ్యే ఉపశమన మార్గాన్ని ఇస్తుంది మరియు అది ఎలా సహాయపడుతుందో చెబుతుంది.
    id: Q2.c3
    marks: 1.25
  id: Q2
  max_marks: 4
  model_answer: హెల్యుసినేషన్ అనేది ఒక మోడల్ తన ఇన్‌పుట్ లేదా మూలాల ద్వారా మద్దతు లేని తప్పుడు వచనాన్ని ఉత్పత్తి చేస్తుంది. దీనికి ఒక కారణం ఏమిటంటే, నెక్స్ట్-టోకెన్ శిక్షణ ధృవీకరించబడిన వాస్తవాలను కాకుండా, నమ్మదగిన వచనాన్ని ప్రోత్సహిస్తుంది. దీనిని తగ్గించడానికి రిట్రీవల్ ఆగ్మెంటెడ్ జనరేషన్ ఉపయోగపడుతుంది, ఇది తిరిగి పొందిన పత్రాలలో సమాధానాలను ఆధారంగా చేసుకుని, వాటిని ఉదహరించడానికి మోడల్‌ను అనుమతిస్తుంది.
  text: పెద్ద భాషా నమూనాలలో భ్రాంతి అంటే ఏమిటి? ఒక కారణం మరియు ఒక నివారణను ఇవ్వండి. (4 మార్కులు)
- aliases:
  - '3'
  - Ans 3
  - '3.'
  criteria:
  - description: టాస్క్ డేటాను ఉపయోగించి మోడల్ వెయిట్లను ఫైన్-ట్యూనింగ్ నవీకరిస్తుందని రాష్ట్రాలు చెబుతున్నాయి.
    id: Q3.c1
    marks: 1
  - description: ఇన్-కాంటెక్స్ట్ లెర్నింగ్ వెయిట్స్ ను మార్చకుండా ఉంచుతుందని మరియు ప్రాంప్ట్ లో సూచనలు లేదా ఉదాహరణలను ఉపయోగిస్తుందని పేర్కొంది.
    id: Q3.c2
    marks: 1
  - description: లేబుల్ చేయబడిన డేటా, కంప్యూట్ లేదా శిక్షణ రన్ వంటి ఫైన్-ట్యూనింగ్ యొక్క కనీసం ఒక ఖర్చును ఇస్తుంది.
    id: Q3.c3
    marks: 1
  - description: ఇది కంటెక్స్ట్ విండో పరిమాణం లేదా ప్రతి కాల్‌లో అదనపు టోకెన్‌ల వంటి సందర్భోచిత అభ్యాసానికి కనీసం ఒక పరిమితిని ఇస్తుంది.
    id: Q3.c4
    marks: 1
  - description: ప్రతి విధానాన్ని ఎప్పుడు ఎంచుకోవాలో చెబుతుంది, ఉదాహరణకు తగినంత డేటాతో స్థిరమైన అధిక-వాల్యూమ్ టాస్క్‌తో పోలిస్తే ప్రోటోటైపింగ్.
    id: Q3.c5
    marks: 2
  id: Q3
  max_marks: 6
  model_answer: ఫైన్-ట్యూనింగ్ అనేది టాస్క్ డేటాపై మోడల్ యొక్క వెయిట్‌లను నవీకరిస్తుంది, కాబట్టి దీనికి లేబుల్ చేయబడిన ఉదాహరణలు, గణన మరియు శిక్షణ అవసరం. కానీ ఇన్ఫరెన్స్ సమయంలో ఎటువంటి ఉదాహరణలు అవసరం లేదు మరియు కొత్త ఫార్మాట్‌లను బాగా నేర్చుకోగలదు. ఇన్-కాంటెక్స్ట్ లెర్నింగ్ వెయిట్‌లను మార్చకుండా సూచనలు మరియు కొన్ని ఉదాహరణలను ప్రాంప్ట్‌లో ఉంచుతుంది; ఇది ప్రయత్నించడానికి త్వరగా మరియు చౌకగా ఉంటుంది, కానీ కాంటెక్స్ట్ విండో ద్వారా పరిమితం చేయబడుతుంది మరియు ప్రతి కాల్‌కు టోకెన్‌లను జోడిస్తుంది. ప్రోటోటైప్ చేయడానికి ఇన్-కాంటెక్స్ట్ లెర్నింగ్‌ను ఉపయోగించండి మరియు తగినంత డేటా ఉన్నప్పుడు మరియు టాస్క్ స్థిరంగా మరియు అధిక వాల్యూమ్‌లో ఉన్నప్పుడు ఫైన్-ట్యూనింగ్ చేయండి.
  text: ఒక కొత్త పని కోసం ఒక LLMని అనుగుణంగా మార్చడానికి ఫైన్-ట్యూనింగ్ మరియు ఇన్-కాంటెక్స్ట్ లెర్నింగ్‌ను పోల్చండి. (6 మార్కులు)
title: జనరేటివ్ AI బేసిక్స్ క్విజ్ (Telugu)
