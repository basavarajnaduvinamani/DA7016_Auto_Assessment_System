exam_id: da7016-sample-kn
language: kn
questions:
- aliases:
  - '1'
  - Ans 1
  - '1.'
  criteria:
  - description: ಕ್ವೆರಿಗಳು, ಕೀಲಿಗಳು ಮತ್ತು ಮೌಲ್ಯಗಳು ಇನ್‌ಪುಟ್ ಟೋಕನ್‌ಗಳ ರೇಖೀಯ ಪ್ರಕ್ಷೇಪಣೆಗಳಾಗಿವೆ ಎಂದು ಹೇಳುತ್ತದೆ.
    id: Q1.c1
    marks: 1
  - description: ಕೀಗಳೊಂದಿಗೆ ಪ್ರಶ್ನೆಯ ಡಾಟ್ ಪ್ರಾಡಕ್ಟ್‌ನಿಂದ ತೂಕಗಳು ಬರುತ್ತವೆ ಎಂದು ಹೇಳುತ್ತದೆ, ಕೀ ಆಯಾಮದ ವರ್ಗಮೂಲದಿಂದ ಸ್ಕೇಲ್ ಮಾಡಲಾಗುತ್ತದೆ.
    id: Q1.c2
    marks: 1.5
  - allow_partial: false
    description: ಒಂದಕ್ಕೆ ಮೊತ್ತವಾಗುವಂತೆ ಅಂಕಗಳನ್ನು ತೂಕಗಳಾಗಿ ಪರಿವರ್ತಿಸುವ ಸಾಫ್ಟ್‌ಮ್ಯಾಕ್ಸ್ ಅನ್ನು ಉಲ್ಲೇಖಿಸುತ್ತದೆ.
    id: Q1.c3
    marks: 1
  - allow_partial: false
    description: ಔಟ್‌ಪುಟ್ ಮೌಲ್ಯದ ವೆಕ್ಟರ್‌ಗಳ ತೂಕದ ಮೊತ್ತವಾಗಿದೆ ಎಂದು ಹೇಳುತ್ತದೆ.
    id: Q1.c4
    marks: 1
  - allow_partial: false
    description: ಮಲ್ಟಿ-ಹೆಡ್ ಅಟೆನ್ಷನ್ ಅನ್ನು ಸಮಾನಾಂತರವಾಗಿ ಹಲವಾರು ಗಮನ ಕಾರ್ಯಾಚರಣೆಗಳಾಗಿ ವಿವರಿಸುತ್ತದೆ, ಅವುಗಳ ಔಟ್‌ಪುಟ್‌ಗಳನ್ನು ಜೋಡಿಸಲಾಗುತ್ತದೆ.
    id: Q1.c5
    marks: 0.5
  id: Q1
  max_marks: 5
  model_answer: ಪ್ರತಿ ಟೋಕನ್‌ಗೆ ಅಟೆನ್ಷನ್ ಮೌಲ್ಯದ ವೆಕ್ಟರ್‌ಗಳ ತೂಕದ ಮೊತ್ತವನ್ನು ಲೆಕ್ಕಾಚಾರ ಮಾಡುತ್ತದೆ. ಪ್ರಶ್ನೆಗಳು, ಕೀಲಿಗಳು ಮತ್ತು ಮೌಲ್ಯಗಳು ಇನ್‌ಪುಟ್‌ನ ರೇಖೀಯ ಪ್ರಕ್ಷೇಪಣೆಗಳಾಗಿವೆ. ಪ್ರತಿ ಕೀಲಿಯೊಂದಿಗೆ ಪ್ರಶ್ನೆಯ ಸ್ಕೇಲ್ಡ್ ಡಾಟ್ ಉತ್ಪನ್ನದಿಂದ ತೂಕಗಳು ಬರುತ್ತವೆ, ಕೀಲಿಯ ಆಯಾಮದ ವರ್ಗಮೂಲದಿಂದ ಭಾಗಿಸಲಾಗುತ್ತದೆ ಮತ್ತು ಸಾಫ್ಟ್‌ಮ್ಯಾಕ್ಸ್ ಮೂಲಕ ಹಾದುಹೋಗುತ್ತದೆ. ಮಲ್ಟಿ-ಹೆಡ್ ಅಟೆನ್ಷನ್ ಇವುಗಳಲ್ಲಿ ಹಲವನ್ನು ವಿಭಿನ್ನ ಪ್ರಕ್ಷೇಪಣೆಗಳಲ್ಲಿ ಸಮಾನಾಂತರವಾಗಿ ಚಲಾಯಿಸುತ್ತದೆ ಮತ್ತು ಅವುಗಳನ್ನು ಸಂಯೋಜಿಸುತ್ತದೆ.
  text: ಟ್ರಾನ್ಸ್‌ಫಾರ್ಮರ್‌ನಲ್ಲಿರುವ ಅಟೆನ್ಷನ್ ಮೆಕ್ಯಾನಿಸಮ್ ಏನು ಲೆಕ್ಕಾಚಾರ ಮಾಡುತ್ತದೆ ಎಂಬುದನ್ನು ವಿವರಿಸಿ. (5 ಅಂಕಗಳು)
- aliases:
  - '2'
  - Ans 2
  - '2.'
  criteria:
  - description: ಇನ್‌ಪುಟ್ ಅಥವಾ ಮೂಲಗಳಿಂದ ಬೆಂಬಲಿತವಲ್ಲದ ಸುಲಲಿತ ಔಟ್‌ಪುಟ್ ಅನ್ನು ಭ್ರಮೆ ಎಂದು ವ್ಯಾಖ್ಯಾನಿಸುತ್ತದೆ.
    id: Q2.c1
    marks: 1.5
  - description: ಸತ್ಯಕ್ಕಿಂತ ಹೆಚ್ಚಾಗಿ ಸಮಂಜಸತೆಗೆ ಪ್ರತಿಫಲ ನೀಡುವ ನೆಕ್ಸ್ಟ್-ಟೋಕನ್ ತರಬೇತಿ ಅಥವಾ ತರಬೇತಿ ದತ್ತಾಂಶದಲ್ಲಿನ ಅಂತರಗಳಂತಹ ಒಂದು ಮಾನ್ಯ ಕಾರಣವನ್ನು ನೀಡುತ್ತದೆ.
    id: Q2.c2
    marks: 1.25
  - description: ಮೂಲಗಳನ್ನು ಉಲ್ಲೇಖಿಸುವ ಅಥವಾ ಖಚಿತವಿಲ್ಲದಿದ್ದಾಗ ದೂರವಿರುವಂತಹ ಒಂದು ಮಾನ್ಯವಾದ ತಗ್ಗಿಸುವಿಕೆಯನ್ನು ನೀಡುತ್ತದೆ ಮತ್ತು ಅದು ಹೇಗೆ ಸಹಾಯ ಮಾಡುತ್ತದೆ ಎಂದು ಹೇಳುತ್ತದೆ.
    id: Q2.c3
    marks: 1.25
  id: Q2
  max_marks: 4
  model_answer: ಭ್ರಮೆ ಎಂದರೆ ಒಂದು ಮಾದರಿಯು ಸುಲಲಿತ ಪಠ್ಯವನ್ನು ಉತ್ಪಾದಿಸಿದಾಗ ಅದು ತಪ್ಪು ಅಥವಾ ಅದರ ಇನ್‌ಪುಟ್ ಅಥವಾ ಮೂಲಗಳಿಂದ ಬೆಂಬಲಿತವಾಗಿರುವುದಿಲ್ಲ. ಇದಕ್ಕೆ ಒಂದು ಕಾರಣವೆಂದರೆ ಮುಂದಿನ ಟೋಕನ್ ತರಬೇತಿಯು ಸಮಂಜಸವಾದ ಪಠ್ಯಕ್ಕೆ ಪ್ರತಿಫಲ ನೀಡುತ್ತದೆ, ಪರಿಶೀಲಿಸಲಾದ ಸತ್ಯಗಳಿಗಲ್ಲ. ಒಂದು ಪರಿಹಾರವೆಂದರೆ ಮರುಪಡೆಯುವಿಕೆ ವರ್ಧಿತ ಉತ್ಪಾದನೆ, ಇದು ಮರುಪಡೆದ ದಾಖಲೆಗಳಲ್ಲಿ ಉತ್ತರಗಳನ್ನು ಆಧರಿಸಿದೆ ಮತ್ತು ಮಾದರಿಯು ಅವುಗಳನ್ನು ಉಲ್ಲೇಖಿಸಲು ಅನುವು ಮಾಡಿಕೊಡುತ್ತದೆ.
  text: ದೊಡ್ಡ ಭಾಷಾ ಮಾದರಿಗಳಲ್ಲಿ ಭ್ರಮೆ ಎಂದರೇನು? ಒಂದು ಕಾರಣ ಮತ್ತು ಒಂದು ತಗ್ಗಿಸುವಿಕೆಯನ್ನು ನೀಡಿ. (4 ಅಂಕಗಳು)
- aliases:
  - '3'
  - Ans 3
  - '3.'
  criteria:
  - description: ಫೈನ್-ಟ್ಯೂನಿಂಗ್ ಕಾರ್ಯದ ಡೇಟಾವನ್ನು ಬಳಸಿಕೊಂಡು ಮಾದರಿಯ ತೂಕಗಳನ್ನು ನವೀಕರಿಸುತ್ತದೆ ಎಂದು ಹೇಳುತ್ತದೆ.
    id: Q3.c1
    marks: 1
  - description: ಇನ್-ಕಾಂಟೆಕ್ಸ್ಟ್ ಲರ್ನಿಂಗ್ ತೂಕಗಳನ್ನು ಬದಲಾಯಿಸದೆ ಹಾಗೆಯೇ ಬಿಡುತ್ತದೆ ಮತ್ತು ಪ್ರಾಂಪ್ಟ್‌ನಲ್ಲಿ ಸೂಚನೆಗಳು ಅಥವಾ ಉದಾಹರಣೆಗಳನ್ನು ಬಳಸುತ್ತದೆ ಎಂದು ಹೇಳುತ್ತದೆ.
    id: Q3.c2
    marks: 1
  - description: ಲೇಬಲ್ ಮಾಡಲಾದ ಡೇಟಾ, ಕಂಪ್ಯೂಟ್ ಅಥವಾ ತರಬೇತಿ ರನ್‌ನಂತಹ ಫೈನ್-ಟ್ಯೂನಿಂಗ್‌ನ ಕನಿಷ್ಠ ಒಂದು ವೆಚ್ಚವನ್ನು ನೀಡುತ್ತದೆ.
    id: Q3.c3
    marks: 1
  - description: ಪ್ರತಿ ಕರೆಗೆ ಸಂದರ್ಭ ವಿಂಡೋ ಗಾತ್ರ ಅಥವಾ ಹೆಚ್ಚುವರಿ ಟೋಕನ್‌ಗಳಂತಹ ಕನಿಷ್ಠ ಒಂದು ಮಿತಿಯನ್ನು ಇನ್-ಕಾಂಟೆಕ್ಸ್ಟ್ ಲರ್ನಿಂಗ್‌ಗೆ ನೀಡುತ್ತದೆ.
    id: Q3.c4
    marks: 1
  - description: ಪ್ರತಿಯೊಂದು ವಿಧಾನವನ್ನು ಯಾವಾಗ ಆರಿಸಿಕೊಳ್ಳಬೇಕು ಎಂಬುದನ್ನು ಹೇಳುತ್ತದೆ, ಉದಾಹರಣೆಗೆ ಸಾಕಷ್ಟು ದತ್ತಾಂಶದೊಂದಿಗೆ ಸ್ಥಿರವಾದ ಹೆಚ್ಚಿನ-ಪ್ರಮಾಣದ ಕಾರ್ಯಕ್ಕೆ ಹೋಲಿಸಿದರೆ ಮೂಲಮಾದರಿಯನ್ನು (prototyping) ಯಾವಾಗ ಆರಿಸಿಕೊಳ್ಳಬೇಕು ಎಂದು ತಿಳಿಸುತ್ತದೆ.
    id: Q3.c5
    marks: 2
  id: Q3
  max_marks: 6
  model_answer: ಫೈನ್-ಟ್ಯೂನಿಂಗ್ ಕಾರ್ಯದ ಡೇಟಾದಲ್ಲಿ ಮಾದರಿಯ ತೂಕಗಳನ್ನು ನವೀಕರಿಸುತ್ತದೆ, ಆದ್ದರಿಂದ ಇದಕ್ಕೆ ಲೇಬಲ್ ಮಾಡಿದ ಉದಾಹರಣೆಗಳು, ಕಂಪ್ಯೂಟ್ ಮತ್ತು ತರಬೇತಿ ರನ್ ಅಗತ್ಯವಿದೆ, ಆದರೆ ನಂತರ ಅನುಮಾನದಲ್ಲಿ ಯಾವುದೇ ಉದಾಹರಣೆಗಳ ಅಗತ್ಯವಿಲ್ಲ ಮತ್ತು ಹೊಸ ಸ್ವರೂಪಗಳನ್ನು ಚೆನ್ನಾಗಿ ಕಲಿಯಬಹುದು. ಇನ್-ಕಾಂಟೆಕ್ಸ್ಟ್ ಕಲಿಕೆಯು ತೂಕಗಳನ್ನು ಬದಲಿಸದೆ ಸೂಚನೆಗಳು ಮತ್ತು ಕೆಲವು ಉದಾಹರಣೆಗಳನ್ನು ಪ್ರಾಂಪ್ಟ್‌ನಲ್ಲಿ ಇರಿಸುತ್ತದೆ; ಇದು ಪ್ರಯತ್ನಿಸಲು ತ್ವರಿತ ಮತ್ತು ಅಗ್ಗವಾಗಿದೆ ಆದರೆ ಸಂದರ್ಭ ವಿಂಡೋದಿಂದ ಸೀಮಿತವಾಗಿದೆ ಮತ್ತು ಪ್ರತಿ ಕರೆಯಲ್ಲಿ ಟೋಕನ್‌ಗಳನ್ನು ಸೇರಿಸುತ್ತದೆ. ಸಾಕಷ್ಟು ಡೇಟಾ ಇದ್ದಾಗ ಮತ್ತು ಕಾರ್ಯವು ಸ್ಥಿರವಾಗಿದ್ದಾಗ ಮತ್ತು ಹೆಚ್ಚಿನ ಪ್ರಮಾಣದಲ್ಲಿದ್ದಾಗ ಪ್ರೊಟೊಟೈಪ್ ಮಾಡಲು ಇನ್-ಕಾಂಟೆಕ್ಸ್ಟ್ ಕಲಿಕೆಯನ್ನು ಬಳಸಿ ಮತ್ತು ಫೈನ್-ಟ್ಯೂನಿಂಗ್ ಅನ್ನು ಬಳಸಿ.
  text: ಹೊಸ ಕಾರ್ಯಕ್ಕೆ LLM ಅನ್ನು ಅಳವಡಿಸಲು ಫೈನ್-ಟ್ಯೂನಿಂಗ್ ಮತ್ತು ಇನ್-ಕಾಂಟೆಕ್ಸ್ಟ್ ಲರ್ನಿಂಗ್ ಅನ್ನು ಹೋಲಿಕೆ ಮಾಡಿ. (6 ಅಂಕಗಳು)
title: ಜನರೇಟಿವ್ ಎಐ ಮೂಲಭೂತ ಪ್ರಶ್ನಾವಳಿ (Kannada)
