  - description: சூழல் சாளர அளவு அல்லது ஒவ்வொரு அழைப்பிலும் கூடுதல் டோக்கன்கள் போன்ற சூழலில் கற்றலின் குறைந்தபட்சம் ஒரு வரம்பை வழங்குகிறது.
    id: Q3.c4
    marks: 1
  - description: எந்த அணுகுமுறையை எப்போது முன்னுரிமைப்படுத்த வேண்டும் என்று கூறுகிறது, உதாரணமாக போதுமான தரவுகளுடன் நிலையான அதிக அளவிலான பணிக்கு முன்மாதிரி எதிராக.
    id: Q3.c5
